name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release-bot app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build release artifacts
        run: make dist VERSION=${{ github.ref_name }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz,dist/checksums.txt
          generate_release_notes: true

      - name: Update krew manifest
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master

          OLD_VERSION=$(grep -m1 '^  version:' plugins/aibom.yaml | awk '{print $2}')
          NEW_VERSION="${{ github.ref_name }}"
          sed -i "s/${OLD_VERSION}/${NEW_VERSION}/g" plugins/aibom.yaml

          while read -r hash file; do
            awk -v file="$file" -v hash="$hash" '
              $0 ~ file { print; getline; sub(/sha256: .*/, "sha256: " hash); print; next }
              { print }
            ' plugins/aibom.yaml > plugins/aibom.yaml.tmp
            mv plugins/aibom.yaml.tmp plugins/aibom.yaml
          done < dist/checksums.txt

          git add plugins/aibom.yaml
          git diff --cached --quiet || git commit -m "Point krew manifest at ${NEW_VERSION}"
          git push origin master
