apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v1.0.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.0.0/kubectl-aibom_v1.0.0_linux_amd64.tar.gz
    sha256: 8fa612b330bba004096b0450a715a1f1fe0515eefb480c52367571419488ae07
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.0.0/kubectl-aibom_v1.0.0_linux_arm64.tar.gz
    sha256: 22b0d4b0e6fe900f68612ccb64ca14220dd0d9dcc8e9e919444799983a35164e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.0.0/kubectl-aibom_v1.0.0_darwin_amd64.tar.gz
    sha256: ef50d445b08065e634702c8e9ee64446f62b15d678c3d8807b87f984e1685369
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.0.0/kubectl-aibom_v1.0.0_darwin_arm64.tar.gz
    sha256: a7624282b483d371671774dac6be7e2be1a2f3a8d3e0f27cc2624da8a45327b7
    bin: kubectl-aibom
