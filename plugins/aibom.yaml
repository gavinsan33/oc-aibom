apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.3.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.0/kubectl-aibom_v0.3.0_linux_amd64.tar.gz
    sha256: 4e02aa12c6625e34be3f9274741e2e4750fc1c5ce862de1c5c68e9c8fb33e4c3
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.0/kubectl-aibom_v0.3.0_linux_arm64.tar.gz
    sha256: 7ebfc3024f478adc86ec5df798169573d0a5f3a859dba9345e3839a9b718d571
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.0/kubectl-aibom_v0.3.0_darwin_amd64.tar.gz
    sha256: a64aeb20c9437b0be5beb6f1b82b4e6ce401728c1b01870776bfcfcfa1f4dfeb
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.0/kubectl-aibom_v0.3.0_darwin_arm64.tar.gz
    sha256: 9b94e58272d0b452330a66ce4cd1906e872b7ff00861f003d19f543f7bc3a8fb
    bin: kubectl-aibom
