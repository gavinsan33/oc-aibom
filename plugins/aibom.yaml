apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v1.2.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.2.0/kubectl-aibom_v1.2.0_linux_amd64.tar.gz
    sha256: c86f4b9f5b6e7f24bdaad3d55f833bbe56098b34494ed018cb150ddd74c8e478
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.2.0/kubectl-aibom_v1.2.0_linux_arm64.tar.gz
    sha256: b7b011652e55a62977d73ffd3fd0e2eb81458e185985c0e4d25c7cc906ffda51
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.2.0/kubectl-aibom_v1.2.0_darwin_amd64.tar.gz
    sha256: 607c8375212fe3956717c6573b395f3bdd4edaec8dce94cc83706e9a2b83f135
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.2.0/kubectl-aibom_v1.2.0_darwin_arm64.tar.gz
    sha256: 3fa2c2900ec1c2c1616371874778129030ed0036048ed9477598a3caa917e8a8
    bin: kubectl-aibom
