apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.6.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.1/kubectl-aibom_v0.6.1_linux_amd64.tar.gz
    sha256: de61692b7140d122f22573f98ee7c5603281501b2a36696600617936f752c663
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.1/kubectl-aibom_v0.6.1_linux_arm64.tar.gz
    sha256: d66a645769444c9edae5b8a252d0c78a7dbfda0c1ee9df4a5e96e729d1a5a92c
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.1/kubectl-aibom_v0.6.1_darwin_amd64.tar.gz
    sha256: 45483bfbdeca9b782ab7907e8758d9be2ddf6e2ecc14170d68cc3440e23d0dab
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.1/kubectl-aibom_v0.6.1_darwin_arm64.tar.gz
    sha256: 682e4fcdf8c1ee4904e11814d5b81e32b910899c10ae24f4a093bf88ebf9c142
    bin: kubectl-aibom
