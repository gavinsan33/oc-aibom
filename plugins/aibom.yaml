apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.5.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.1/kubectl-aibom_v0.5.1_linux_amd64.tar.gz
    sha256: 2d8bd00aedf7558fa1aa7dbc1ca95b58621fb466bbd3820816c78087d23d90ca
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.1/kubectl-aibom_v0.5.1_linux_arm64.tar.gz
    sha256: a45ff35c17afb144486ebdc37f40bdf5e423dce8cf170f6ebc64e316f283c97e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.1/kubectl-aibom_v0.5.1_darwin_amd64.tar.gz
    sha256: 443de906e3058aee51a134e607405ca0b4d1ba265569e846b529dfbe1fd2566e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.1/kubectl-aibom_v0.5.1_darwin_arm64.tar.gz
    sha256: 14be4d5ae49738cd17109be64edac0c68137d06f362e0dbf65bffaf96fb12ef8
    bin: kubectl-aibom
