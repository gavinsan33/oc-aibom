apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.4.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.0/kubectl-aibom_v0.4.0_linux_amd64.tar.gz
    sha256: 8883b8fe2c03508f47db1a04260e80001523e337924fa8c7230de0978f42577f
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.0/kubectl-aibom_v0.4.0_linux_arm64.tar.gz
    sha256: dff6899b33255ed0522882d0979d1e036618a211f1a0212a1799c0432570a40d
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.0/kubectl-aibom_v0.4.0_darwin_amd64.tar.gz
    sha256: 02cce551f0007f1642027f2466bcdba1dbcd58447499cf71a993e3d35a19066a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.0/kubectl-aibom_v0.4.0_darwin_arm64.tar.gz
    sha256: 5c6930033d93d99bbf04a69e852c6bffa5eeb38b0ee0369e8403965761665242
    bin: kubectl-aibom
