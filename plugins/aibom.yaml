apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.4.15
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.15/kubectl-aibom_v0.4.15_linux_amd64.tar.gz
    sha256: 78cd28a18d7258b4a104f4ba4ba220325e5181696217b8b7326e7d119bcbed59
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.15/kubectl-aibom_v0.4.15_linux_arm64.tar.gz
    sha256: c413ccaa48b2f3ff505e42f201be1309a5bb8216635a25d2b02521da82ba4afa
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.15/kubectl-aibom_v0.4.15_darwin_amd64.tar.gz
    sha256: 5ae930e30f75336bd29bfc663d437efbc3380ddf91daba47fa7a6576fe135457
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.15/kubectl-aibom_v0.4.15_darwin_arm64.tar.gz
    sha256: e89c4e3232cca8889888a21846e0b9f0b0a5c4faf9c012037bc13cade8f09bcb
    bin: kubectl-aibom
