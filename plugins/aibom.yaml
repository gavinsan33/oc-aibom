apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.10.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.0/kubectl-aibom_v0.10.0_linux_amd64.tar.gz
    sha256: e4759776ca8b0344cd88cf8e8d893f3be0b58fd2fa7a74a169b53e8f51e1ac77
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.0/kubectl-aibom_v0.10.0_linux_arm64.tar.gz
    sha256: 134c7eaa6c8e6cadf853f04c12f628f8f7093fcb71b1e35e9f143bff81c0a3a7
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.0/kubectl-aibom_v0.10.0_darwin_amd64.tar.gz
    sha256: 2a12b01ba3fa9ddf99d3f537b7bd3a7e3e7d32c07311d2bcd8aff510c0691a28
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.0/kubectl-aibom_v0.10.0_darwin_arm64.tar.gz
    sha256: 49adeca444a72296939a9c52c66ee12885b47b295e492d3981f5539d05a08239
    bin: kubectl-aibom
