apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.7.3
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.3/kubectl-aibom_v0.7.3_linux_amd64.tar.gz
    sha256: e9b9135ccdefd55e45721e2adc5d4418cfb88034f19fd67aff23daf65aacf209
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.3/kubectl-aibom_v0.7.3_linux_arm64.tar.gz
    sha256: bcc00ef89f8a3ac530779f2c3b900bf5709f07877ae229f9b1f32d1ed041103a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.3/kubectl-aibom_v0.7.3_darwin_amd64.tar.gz
    sha256: 0783c81b1e246f08c9f2e371705c0348f9a2faddbeb2afa06f6afa7e371adbcc
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.3/kubectl-aibom_v0.7.3_darwin_arm64.tar.gz
    sha256: 5e4fd31277d73062259e505dbf741445004331f319ba2e14b0ad571da498e5a3
    bin: kubectl-aibom
