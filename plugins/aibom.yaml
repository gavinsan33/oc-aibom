apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.5.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.2/kubectl-aibom_v0.5.2_linux_amd64.tar.gz
    sha256: e3e39ae6d3d512d9ca27d4f4a0e4fd0a443a419da8eba455bc0c62f4d63869d7
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.2/kubectl-aibom_v0.5.2_linux_arm64.tar.gz
    sha256: c6e422ab17e150525516a3186b7eea0de4e51f98fd1590ad4081ad84471332ee
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.2/kubectl-aibom_v0.5.2_darwin_amd64.tar.gz
    sha256: 955261a445112f48cd0fbcae577efbd59dd4e8b97e52a585b4d8f99b44fbad40
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.2/kubectl-aibom_v0.5.2_darwin_arm64.tar.gz
    sha256: 0160fdcd99520342753db5fe03af7b5705c7780e3b946e50760e64bef9ae8391
    bin: kubectl-aibom
