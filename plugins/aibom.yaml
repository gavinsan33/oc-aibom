apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.8.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.0/kubectl-aibom_v0.8.0_linux_amd64.tar.gz
    sha256: 2e5292ba98d88fc1a00413d83d57f2b55413cc12b3b7ed477c42a525a0010d7e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.0/kubectl-aibom_v0.8.0_linux_arm64.tar.gz
    sha256: ea0edcf2cce35c49fc74c7e14d3ee39e4379fb9870519ae2f35daec08f4c547c
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.0/kubectl-aibom_v0.8.0_darwin_amd64.tar.gz
    sha256: 255852b9d14e651f6bd4725b0eb93df8d3690c273e0f804aaef8e9469c8e1059
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.0/kubectl-aibom_v0.8.0_darwin_arm64.tar.gz
    sha256: 8a619aee3e315804d06c2b779e6a23fbb53a0f7af425d1fbe73933b3ccc28e1f
    bin: kubectl-aibom
