apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.2.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.1/kubectl-aibom_v0.2.1_linux_amd64.tar.gz
    sha256: eacdbf0a2cc234aaa5e85bb8accc243066576986832aa7312d3132b50e235d4c
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.1/kubectl-aibom_v0.2.1_linux_arm64.tar.gz
    sha256: 0ddbd0a89a23bed5d0a48426b46ac910c99b95fa2647e75fb532ab698000da5e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.1/kubectl-aibom_v0.2.1_darwin_amd64.tar.gz
    sha256: e0274f0365fef293b32030c99722eacefea42065e8b7fd202c56c9d93f9b720e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.1/kubectl-aibom_v0.2.1_darwin_arm64.tar.gz
    sha256: 98f419427d7d972bce68372528f56f91f111766010e830c6369a46a730530074
    bin: kubectl-aibom
