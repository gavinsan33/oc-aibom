apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.5.3
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.3/kubectl-aibom_v0.5.3_linux_amd64.tar.gz
    sha256: 82efc27346c28ff9f2b480e7940cf98c3daef84d92a71b993b2b7d749f44cc42
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.3/kubectl-aibom_v0.5.3_linux_arm64.tar.gz
    sha256: 482f9eefc8ec123602e555b7af184008101502b664424ae1180e107976057b6a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.3/kubectl-aibom_v0.5.3_darwin_amd64.tar.gz
    sha256: 602dbc2fcffa996798f87684a7b71ec250fd78078bea04e0d1e824fb527f7712
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.3/kubectl-aibom_v0.5.3_darwin_arm64.tar.gz
    sha256: 1f35c25eba7bc5cd6e1838227974b52d8307dd7720614f46bf22449269486cb6
    bin: kubectl-aibom
