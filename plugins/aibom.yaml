apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.5.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.0/kubectl-aibom_v0.5.0_linux_amd64.tar.gz
    sha256: 9f2f718a9012fbb986d0e5a14e78be794d9c7a6d37e5b92f0d51e205a6f961a4
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.0/kubectl-aibom_v0.5.0_linux_arm64.tar.gz
    sha256: faaddd0bb83aabfcfcfae26724c626518fb2facd1fa264f1b446e58f64c5a23b
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.0/kubectl-aibom_v0.5.0_darwin_amd64.tar.gz
    sha256: cd095470e798d087b29da8e85e1f516c2534ca9a779f92a5a6582ae8caf03a42
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.5.0/kubectl-aibom_v0.5.0_darwin_arm64.tar.gz
    sha256: 80613e0260dd98afc4e2c9a2a425d3fa92db29c84c1b80f24dccc1504142810c
    bin: kubectl-aibom
