apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.7.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.0/kubectl-aibom_v0.7.0_linux_amd64.tar.gz
    sha256: 4fe673fb00ebfa2f757a4324c863694d20ea2a315f182b210960ef1ce8553b6e
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.0/kubectl-aibom_v0.7.0_linux_arm64.tar.gz
    sha256: 9c1dcf7a17b9e9be9109b3b3d6b2ac4eb378b24527cd26ceb8f83da3b8167d19
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.0/kubectl-aibom_v0.7.0_darwin_amd64.tar.gz
    sha256: 17d1e1de0bcbe839d0bd468e2946e9d44374180f6ce459ebdc06fd6847ea4c1c
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.0/kubectl-aibom_v0.7.0_darwin_arm64.tar.gz
    sha256: a51e34602bf822d39e3fe925e4e6df9a3bd70977118615307ec9d8f901b33488
    bin: kubectl-aibom
