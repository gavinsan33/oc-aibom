apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v1.3.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.1/kubectl-aibom_v1.3.1_linux_amd64.tar.gz
    sha256: f60f38d935a059eaca4ae82ba2d1e10ce9edfa11e18a3b579647342594a27b7a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.1/kubectl-aibom_v1.3.1_linux_arm64.tar.gz
    sha256: 78402746ddc52c3b3cedc552464f5126b890c24cdc08ce20051a4a67db31e3af
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.1/kubectl-aibom_v1.3.1_darwin_amd64.tar.gz
    sha256: a842e9396e523d16983fef7d46e7b5ade14feaf2ddd8b1e7aa4539dd02b03f78
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.1/kubectl-aibom_v1.3.1_darwin_arm64.tar.gz
    sha256: ea3613bf9eca1d6012ebcfdbb80be3d51449fc1fa448b45ad694c8ec120c3179
    bin: kubectl-aibom
