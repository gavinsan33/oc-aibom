apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v1.3.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.2/kubectl-aibom_v1.3.2_linux_amd64.tar.gz
    sha256: a5dac4373093b2b40a3fbcb1b7c1ae595b1ca5bb12256a5bef227042223c4a21
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.2/kubectl-aibom_v1.3.2_linux_arm64.tar.gz
    sha256: 3f92197989f11e41f2062823d60d5e44b37b83652504ea4cf8dfd399c400e2ad
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.2/kubectl-aibom_v1.3.2_darwin_amd64.tar.gz
    sha256: ee4060b4a4039e73b1e1a3207a95dd03f03c0270a042748e76db6c82ca16f3c6
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.2/kubectl-aibom_v1.3.2_darwin_arm64.tar.gz
    sha256: d78264a7e439e3e3a25679c7e189e6c3d7afd4ed3a87039d810cede00eaee84d
    bin: kubectl-aibom
