apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.6.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.2/kubectl-aibom_v0.6.2_linux_amd64.tar.gz
    sha256: 54028457b21ef2c91a993343b03ae8e2c686c141077414b3dd9cecd65f040fe4
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.2/kubectl-aibom_v0.6.2_linux_arm64.tar.gz
    sha256: 3ef2f7bcf1f3a22501b2645659976ce4ca4fcd83b770320e82e3ea24ed4f74b5
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.2/kubectl-aibom_v0.6.2_darwin_amd64.tar.gz
    sha256: 37b948e576d3d05cccebc99599760318b204461e9184e5a01ef8d66f85b61bdf
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.2/kubectl-aibom_v0.6.2_darwin_arm64.tar.gz
    sha256: 5cc5970291a265fabdbebb4c5b0dfc6c0b6165998562aa80306a9a15703156a9
    bin: kubectl-aibom
