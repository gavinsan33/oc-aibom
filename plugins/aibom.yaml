apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.1.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.1.1/kubectl-aibom_v0.1.1_linux_amd64.tar.gz
    sha256: 2cc351854b7871f367973266ba6142ca9a27f53e2ef4c9ec971a63cb26b78bfa
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.1.1/kubectl-aibom_v0.1.1_linux_arm64.tar.gz
    sha256: 6a0d927f6a42b4147c86f94e2ed6e39cfacc7e80a91aacd056292b4b734eb832
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.1.1/kubectl-aibom_v0.1.1_darwin_amd64.tar.gz
    sha256: f737618b2f3af0b28a226cb4f728153452daea50d6197213df8272d4fcfdbffe
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.1.1/kubectl-aibom_v0.1.1_darwin_arm64.tar.gz
    sha256: dff1e652cf5bd94ad7e1ffd9d1308fe939f9962d0e349b1c3d634c532fe783be
    bin: kubectl-aibom
