apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.2.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.0/kubectl-aibom_v0.2.0_linux_amd64.tar.gz
    sha256: b21f8b7f3c95895eac042d559edaa3794c3d68de18407be0dc271cf9479be920
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.0/kubectl-aibom_v0.2.0_linux_arm64.tar.gz
    sha256: be660db679c6c5fc09b49c0349d49a5fd094110c6a578e089b5c24ac69a2baf2
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.0/kubectl-aibom_v0.2.0_darwin_amd64.tar.gz
    sha256: d8c59fb41629c0988ec6f45d7a911c0bf63b533342e270cc8c35be8393f73394
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.2.0/kubectl-aibom_v0.2.0_darwin_arm64.tar.gz
    sha256: 4ea0ebd350a7e94bc0e5d8477a253545acf607afb8e424d793b9ed4d566f9b37
    bin: kubectl-aibom
