apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v1.3.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.0/kubectl-aibom_v1.3.0_linux_amd64.tar.gz
    sha256: 243ebf307d9d7c008f2edfec3eb9167cf3826ffe26e8b36188f9884cafc30536
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.0/kubectl-aibom_v1.3.0_linux_arm64.tar.gz
    sha256: d579318a3600bc1a5d53e520e16f750f4b303e9eea8a4f9c12c6bbef2514defa
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.0/kubectl-aibom_v1.3.0_darwin_amd64.tar.gz
    sha256: c804438d89de69350cbf8020a13deddf398981da3e26b44fd73cd648fad26880
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.3.0/kubectl-aibom_v1.3.0_darwin_arm64.tar.gz
    sha256: 5ba32fcacd9ddaf934544baa74273a296ae1d88ed832b005ed1ae2f17142c278
    bin: kubectl-aibom
