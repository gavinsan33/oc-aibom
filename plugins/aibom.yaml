apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.6.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.0/kubectl-aibom_v0.6.0_linux_amd64.tar.gz
    sha256: 9b85de0c2ee371cb123916e2b2131b109250321f5bbe811f4bd4639b5e82e389
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.0/kubectl-aibom_v0.6.0_linux_arm64.tar.gz
    sha256: fee2f8822b4bf542627fc9a3663b0d664e3a540b3e7283b6e83da1f74f3bdd4a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.0/kubectl-aibom_v0.6.0_darwin_amd64.tar.gz
    sha256: f3d4945f92634f07fc9a60d2e24a8101cc5a8db33b449c3e68b51e84096e3fb6
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.6.0/kubectl-aibom_v0.6.0_darwin_arm64.tar.gz
    sha256: 26a2d0d021beb9406a36b56573ced6b481e15bad781a419631545b4a404c1454
    bin: kubectl-aibom
