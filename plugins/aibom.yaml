apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.3.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.1/kubectl-aibom_v0.3.1_linux_amd64.tar.gz
    sha256: 8ad7506123cd07ce64cf02d9419b4cf5a54128241863054913d0e460919b9c09
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.1/kubectl-aibom_v0.3.1_linux_arm64.tar.gz
    sha256: e97d59d26c03193d9d2a49a94e2a8ab7e39e99b75e9142bf3779d3849ce0c2d5
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.1/kubectl-aibom_v0.3.1_darwin_amd64.tar.gz
    sha256: 83e75ccd1845c17efa8d454ef5efc8de19122f9e9cb09b6fde6444fb2590e5cd
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.1/kubectl-aibom_v0.3.1_darwin_arm64.tar.gz
    sha256: e873994f2ac64052c5a41411e3e31531956e5511b18bc7ccb385cbb0cf01f3d8
    bin: kubectl-aibom
