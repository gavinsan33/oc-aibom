apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.7.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.2/kubectl-aibom_v0.7.2_linux_amd64.tar.gz
    sha256: d760e0180b8312350f94d337636b258666c12814f7cfe0923362c895d74cee5b
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.2/kubectl-aibom_v0.7.2_linux_arm64.tar.gz
    sha256: 04d1351c53dcccc9fc113f30e3e0df6d49f9ed11194f016adc16b50062264301
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.2/kubectl-aibom_v0.7.2_darwin_amd64.tar.gz
    sha256: 79063a7da8649266892e6a22f5a7d0c94d6bc94e0f5fd986a714f657f3634ffe
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.2/kubectl-aibom_v0.7.2_darwin_arm64.tar.gz
    sha256: 29c5f7b0549af09f7f3d58967aeec256a5dc9fd1cac04a08ca84501382504bad
    bin: kubectl-aibom
