apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.9.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.9.0/kubectl-aibom_v0.9.0_linux_amd64.tar.gz
    sha256: 0c273ea21545ca9dbdd62f8d4640be2b9ec390f3debbfe8daffc140904508c85
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.9.0/kubectl-aibom_v0.9.0_linux_arm64.tar.gz
    sha256: 3026317c05f21be9f078d68dd3e3d1dfef091e206b7b1a6663a6dd3b7aa2ab65
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.9.0/kubectl-aibom_v0.9.0_darwin_amd64.tar.gz
    sha256: 5acbb1454bbf5ba18ceec52649cf8f416845e116b8e1711186a5051c3dab979f
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.9.0/kubectl-aibom_v0.9.0_darwin_arm64.tar.gz
    sha256: f55e51aeb3ef6824d9c451a9578b35e7595a6cefc36e60343dbedb456f0bf191
    bin: kubectl-aibom
