apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.4.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.1/kubectl-aibom_v0.4.1_linux_amd64.tar.gz
    sha256: efcf2957080f2eeb4259a860e22422085a1f6f133f757b32b895e2e22cd18048
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.1/kubectl-aibom_v0.4.1_linux_arm64.tar.gz
    sha256: eda56f40a165cd974ac9326cc8a9d9bc9cea741c9c16ff2b93da2828408f804b
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.1/kubectl-aibom_v0.4.1_darwin_amd64.tar.gz
    sha256: 168126dd65fcca2ea1d9aa0a94d780e97e2bf07bb3e409a12c149197774aba09
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.4.1/kubectl-aibom_v0.4.1_darwin_arm64.tar.gz
    sha256: 6a557b49844416831146af4537431f5de8795f1d9d2bec44e51866a71ccf231e
    bin: kubectl-aibom
