apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.10.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.1/kubectl-aibom_v0.10.1_linux_amd64.tar.gz
    sha256: 0e8d9570e6f4e5370674e07bc0202f1a1a776bf6fbb3c314a5bc9ef03fc70dc4
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.1/kubectl-aibom_v0.10.1_linux_arm64.tar.gz
    sha256: 9f7e6fc088513bb3010d0351df772d7f634623ad035c21cdd79260019d5e5b40
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.1/kubectl-aibom_v0.10.1_darwin_amd64.tar.gz
    sha256: 141dff1e3ed1ee56c2b339d5c988c32cadad77678179ba0912529663b2c2e4bd
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.10.1/kubectl-aibom_v0.10.1_darwin_arm64.tar.gz
    sha256: 6dae83905d2ccde3ff8fd574e1851afdc21ef613b9b3141a304b23b2b1e5ff13
    bin: kubectl-aibom
