apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.8.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.1/kubectl-aibom_v0.8.1_linux_amd64.tar.gz
    sha256: acc26498f0ed999203d24b1cd7a979abaed4e45cc9a44973fd4bfa9080b890de
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.1/kubectl-aibom_v0.8.1_linux_arm64.tar.gz
    sha256: 0cbd4a3a5b4a40a919002126670ab379817fa1020fda28a923b63568502cd441
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.1/kubectl-aibom_v0.8.1_darwin_amd64.tar.gz
    sha256: 2e656d3e0f62f965df47e976e618424cfca06175ea7494edaa4c3c54747964c7
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.8.1/kubectl-aibom_v0.8.1_darwin_arm64.tar.gz
    sha256: b55792a6a3c8d47b1aef9d15128f354e6340602fc6797f75e31be0019d47cc5a
    bin: kubectl-aibom
