apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.3.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.2/kubectl-aibom_v0.3.2_linux_amd64.tar.gz
    sha256: 313104fd82bae71786673c05146459c33b042ae514a48a58d457e48a405c600b
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.2/kubectl-aibom_v0.3.2_linux_arm64.tar.gz
    sha256: 3132b49e97e515727a251e8a61182670c5dbfd82ff286cd68795c39660bb89de
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.2/kubectl-aibom_v0.3.2_darwin_amd64.tar.gz
    sha256: d94e330fcf463bee0cc1038267c9ca6ab1e0fa4b90b84f1b6002e48ab66e6ca3
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.2/kubectl-aibom_v0.3.2_darwin_arm64.tar.gz
    sha256: 9e469b21cc1a15a019aa07fd1c375eb24e90fc96db9c20f065277184c692f7dc
    bin: kubectl-aibom
