apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.7.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.1/kubectl-aibom_v0.7.1_linux_amd64.tar.gz
    sha256: 0273600af758ba48d24670a959df12b83d6dd820a79f729dc70898e4d11fd5f0
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.1/kubectl-aibom_v0.7.1_linux_arm64.tar.gz
    sha256: 597a65b914d8006aa92137c3d47892f31d2d9cd75fc9650d5e529b79d8e65c50
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.1/kubectl-aibom_v0.7.1_darwin_amd64.tar.gz
    sha256: 2f807f6d272d04b6c67aff6765910cb86c71455e963ce9a2ec031855eae4317a
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.7.1/kubectl-aibom_v0.7.1_darwin_arm64.tar.gz
    sha256: 8b7bb5055974a20e46221f924f9f249686deff930139c60595b2753797714773
    bin: kubectl-aibom
