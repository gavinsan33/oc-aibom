apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.3.4
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.4/kubectl-aibom_v0.3.4_linux_amd64.tar.gz
    sha256: 16c05410fa1bdd9afd0e1a1c8e444b7ab013e3369a85d0c85a40f407597028be
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.4/kubectl-aibom_v0.3.4_linux_arm64.tar.gz
    sha256: 239b61dd580aeb1cbc2f59dc3bcaaa8029e103cd5b90d6f90b9df46d83462c39
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.4/kubectl-aibom_v0.3.4_darwin_amd64.tar.gz
    sha256: 14d7dff29b2ec8468fa5e2e0b3fdd17c5dc0a7933b83977223e591c255629448
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.3.4/kubectl-aibom_v0.3.4_darwin_arm64.tar.gz
    sha256: 0971dab7d7dfcd86db4422e1e24f02ed7c45229e507f0647bfdaad45123b952b
    bin: kubectl-aibom
