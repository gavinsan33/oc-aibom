apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibom
spec:
  version: v0.11.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibom -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibom list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibom describe <name>
      kubectl aibom diff <name-a> <name-b>
      kubectl aibom compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.11.1/kubectl-aibom_v0.11.1_linux_amd64.tar.gz
    sha256: b8be365293299d557be3914479abd26480d05299466a0f5450d7987b47b57374
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.11.1/kubectl-aibom_v0.11.1_linux_arm64.tar.gz
    sha256: 1627c2d71da19a58549a6ce8c5c85e8e701e5663ad946f79d3c0c9b5b29a1b4d
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.11.1/kubectl-aibom_v0.11.1_darwin_amd64.tar.gz
    sha256: 23575a6cc3512bca96916d6c8bef2968586193f8420a13340ee7b52bb556ce7b
    bin: kubectl-aibom
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v0.11.1/kubectl-aibom_v0.11.1_darwin_arm64.tar.gz
    sha256: 0ca01783da38b66865f45c67fde9137c31a038c3024c4f324a8d2568f6efe842
    bin: kubectl-aibom
