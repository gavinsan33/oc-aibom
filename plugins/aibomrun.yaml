apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibomrun
spec:
  version: v1.5.1
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1) custom resources than raw `oc get aibomrun -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibomrun list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibomrun describe <name>
      kubectl aibomrun diff <name-a> <name-b>
      kubectl aibomrun compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.1/kubectl-aibomrun_v1.5.1_linux_amd64.tar.gz
    sha256: aa3adc27362ea301ffa24990ee4b53a4d67375b7779461a0d33e359c1697126a
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.1/kubectl-aibomrun_v1.5.1_linux_arm64.tar.gz
    sha256: 32594d521aabb6ac6366dd23e29ddeb06677a240ee2a5707fdada648bc14175a
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.1/kubectl-aibomrun_v1.5.1_darwin_amd64.tar.gz
    sha256: b6308fc28b3465b508881f6a5cddae92635d2358a1f8d5b87325b833278a2844
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.1/kubectl-aibomrun_v1.5.1_darwin_arm64.tar.gz
    sha256: bd2c37d2ae0e1cf5ef3715d0e1fb0d538b4ad06dd74f2ed012a672589d07fd8d
    bin: kubectl-aibomrun
