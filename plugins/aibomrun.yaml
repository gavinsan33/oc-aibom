apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibomrun
spec:
  version: v1.5.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1) custom resources than raw `oc get aibomrun -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibomrun list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibomrun describe <name>
      kubectl aibomrun diff <name-a> <name-b>
      kubectl aibomrun compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.0/kubectl-aibomrun_v1.5.0_linux_amd64.tar.gz
    sha256: 564c22b532e21a1373540b3327085584cd882094ced943a53200e456cf79502a
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.0/kubectl-aibomrun_v1.5.0_linux_arm64.tar.gz
    sha256: 07e1990607a74987a130e95efc28b1b798ebc14e8b960162d918f1b3e768c57b
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.0/kubectl-aibomrun_v1.5.0_darwin_amd64.tar.gz
    sha256: 74a3e06e1c36eddec4d94716e1bb08ae99e3c6e94ea63862de49e2bcaa185f39
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.0/kubectl-aibomrun_v1.5.0_darwin_arm64.tar.gz
    sha256: 695a5fa7ac2180066bf73af8f9a89b8c9acc5a52500b10513d433201a0fa48d4
    bin: kubectl-aibomrun
