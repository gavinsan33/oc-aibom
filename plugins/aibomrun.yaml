apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibomrun
spec:
  version: v1.4.0
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1alpha1) custom resources than raw `oc get aibomrun -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibomrun list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibomrun describe <name>
      kubectl aibomrun diff <name-a> <name-b>
      kubectl aibomrun compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.4.0/kubectl-aibomrun_v1.4.0_linux_amd64.tar.gz
    sha256: 817bcabf5773abd455f988e93eb11fbcc9cd2e06ea1814389f8b4ca613966f79
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.4.0/kubectl-aibomrun_v1.4.0_linux_arm64.tar.gz
    sha256: c2dc1817f9affed0d95fc8d8d98b702ae667eb562a56269e38dce655fd982193
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.4.0/kubectl-aibomrun_v1.4.0_darwin_amd64.tar.gz
    sha256: bc8051d314436e4ef9f99610e8beb0ca80ad963bee8f780791ca098026cc275f
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.4.0/kubectl-aibomrun_v1.4.0_darwin_arm64.tar.gz
    sha256: f49898d2b18bc82ec5950266bf385dcc944bda56041c7c5ff3154204089529ba
    bin: kubectl-aibomrun
