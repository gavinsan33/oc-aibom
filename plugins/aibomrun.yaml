apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: aibomrun
spec:
  version: v1.5.2
  homepage: https://github.com/gavinsan33/oc-aibom
  shortDescription: List, inspect, and compare AIBOM custom resources
  description: |
    oc-aibom makes it easier to filter through and compare AIBOM
    (aibom.io/v1) custom resources than raw `oc get aibomrun -o yaml`,
    using only the standard Kubernetes API.

    Usage:
      kubectl aibomrun list [-A] [--model=...] [--intent=...] [--quantization=...] [--drift-only] [--sort-by=...]
      kubectl aibomrun describe <name>
      kubectl aibomrun diff <name-a> <name-b>
      kubectl aibomrun compare <name> <name> [<name>...]
  caveats: |
    Requires read access to aiboms.aibom.io in the target namespace(s).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.2/kubectl-aibomrun_v1.5.2_linux_amd64.tar.gz
    sha256: f04e5b7779c020e8cb82b751772a0f548449d92d8ded3133e1b743f21ee22e43
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.2/kubectl-aibomrun_v1.5.2_linux_arm64.tar.gz
    sha256: e059b039c84c7d53c5acf740a93e31f7268dcfc729f3aaba51298a9a8bc03924
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.2/kubectl-aibomrun_v1.5.2_darwin_amd64.tar.gz
    sha256: 3ecdb63a45360193eaafa30d84a9cb0c00399378f640ca7d4d8d390fd52f68c3
    bin: kubectl-aibomrun
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/gavinsan33/oc-aibom/releases/download/v1.5.2/kubectl-aibomrun_v1.5.2_darwin_arm64.tar.gz
    sha256: 3b2a6f61a08a20444e3cc7bc0806185f4af2b653e65dcb9c65480792699fb6a5
    bin: kubectl-aibomrun
