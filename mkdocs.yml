# Standalone config, for previewing and checking these docs on their own.
# The combined site (with the webhook and console plugin) is built from
# gavinsan33/aibom-monorepo, which includes this file; its theme and
# markdown extensions apply there, so keep this one minimal.
site_name: oc-aibom
repo_url: https://github.com/gavinsan33/oc-aibom
edit_uri: edit/main/docs/

theme:
  name: material

exclude_docs: requirements.txt

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Install: install.md
  - Usage:
      - list: usage/list.md
      - describe: usage/describe.md
      - diff and compare: usage/diff-compare.md
  - Reference:
      - Flags: reference/flags.md
